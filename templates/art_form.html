{% extends 'base.html' %}{% block content %}<h1>Nuevo arte maestro</h1><div class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf}}"><div class="grid"><div><label>Código maestro único *</label><input required name="master_code" placeholder="ART-000145"></div><div><label>Código SAP *</label><input required name="sap_code" placeholder="10004567"></div><div><label>Empresa *</label><select name="company_id" required>{% for c in companies %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div><div><label>Producto *</label><input required name="product"></div><div><label>Tipo de empaque *</label><select name="packaging_type"><option>Etiqueta</option><option>Inserto</option><option>Empaque primario</option><option>Empaque secundario</option><option>Otro</option></select></div></div><label>Descripción</label><textarea name="description"></textarea><button class="btn">Guardar arte</button> <a class="btn gray" href="/">Cancelar</a></form></div>{% endblock %}

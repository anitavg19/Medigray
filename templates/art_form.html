{% extends 'base.html' %}
{% block content %}
<h1>Nuevo arte maestro</h1>
<section class="panel">
<form method="post" action="/artes/nuevo">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="grid">
    <div><label>Código maestro *</label><input name="master_code" required placeholder="ART-000145"></div>
    <div><label>Código SAP *</label><input name="sap_code" required placeholder="10004567"></div>
    <div><label>Empresa *</label><select name="company_id" required>
      {% for c in companies %}<option value="{{c.id}}" {% if c.id == empresa_actual %}selected{% endif %}>{{c.name}}</option>{% endfor %}
    </select></div>
    <div><label>Producto *</label><input name="product" required></div>
    <div><label>Tipo de empaque *</label><select name="packaging_type" required>
      <option>Etiqueta</option><option>Inserto</option><option>Empaque primario</option><option>Empaque secundario</option><option>Otro</option>
    </select></div>
  </div>
  <label>Descripción</label><textarea name="description"></textarea>
  <div class="panel" style="background:#F5F9FD">
    <h2>Documento de Google Drive</h2>
    <label for="drive_url">Enlace del arte *</label>
    <input id="drive_url" type="url" name="drive_url" required placeholder="https://drive.google.com/file/d/ID/view">
    <p class="muted">Solo debe pegar el enlace de un archivo de Drive. El archivo permanece en Drive y debe tener permisos adecuados.</p>
  </div>
  <button type="submit" class="btn">Guardar arte</button>
  <a class="btn gray" href="/">Cancelar</a>
</form>
</section>
{% endblock %}

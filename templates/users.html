{% extends 'base.html' %}{% block content %}<h1>Gestión de usuarios</h1><div class="grid"><section class="panel"><h2>Usuarios</h2><div class="scroll"><table><tr><th>Correo</th><th>Rol</th><th>Activo</th><th>Acción</th></tr>{% for r in rows %}<tr><td>{{r.email}}</td><td>{{r.role}}</td><td>{{'Sí' if r.active else 'No'}}</td><td>{% if r.id != u.id %}<form method="post" action="/usuarios/{{r.id}}/estado"><input type="hidden" name="csrf_token" value="{{csrf}}"><input type="hidden" name="active" value="{{0 if r.active else 1}}"><button class="btn sm gray">{{'Desactivar' if r.active else 'Activar'}}</button></form><form method="post" action="/usuarios/{{r.id}}/eliminar" style="margin-top:6px" onsubmit="return confirm('¿Eliminar a {{r.email}}? Solo se puede si no ha hecho nada en el sistema.')"><input type="hidden" name="csrf_token" value="{{csrf}}"><button class="btn sm" style="background:#B3261E;color:#fff">Eliminar</button></form>{% endif %}</td></tr>{% endfor %}</table></div></section><section class="panel"><h2>Crear usuario</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf}}"><label>Correo</label><input required type="email" name="email"><label>Contraseña temporal (mínimo 12 caracteres)</label><input required type="password" name="password" minlength="12"><label>Rol</label><select name="role">{% for r in roles %}<option>{{r}}</option>{% endfor %}</select><label>Empresa asignada</label><select required name="company_id">{% for co in companies %}<option value="{{co.id}}">{{co.name}}</option>{% endfor %}</select><button class="btn">Crear usuario</button></form></section></div>{% endblock %}

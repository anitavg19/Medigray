
{% extends 'base.html' %}

{% block login %}
<div class="login">
    <div style="font-size:32px;color:#1760a3">◈</div>

    <h1>MEDIGRAY</h1>
<p class="muted">CONTROL DE ARTES</p>
    <p class="muted">DR Pharma · Inversiones Oridama</p>

    {% if error %}
    <div class="notice">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf }}">

        <label>Correo electrónico</label>
        <input type="email" name="email" required autofocus>

        <label>Contraseña</label>
        <div style="position:relative"><input id="pw-login" style="padding-right:84px" type="password" name="password" required><button type="button" onclick="verClave('pw-login', this)" style="position:absolute;right:8px;top:7px;border:0;background:#E5F2FC;color:#1768B0;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer">Mostrar</button></div><script>function verClave(id,b){var i=document.getElementById(id);var v=i.type==='password';i.type=v?'text':'password';b.textContent=v?'Ocultar':'Mostrar';}</script>

        <button class="btn" style="width:100%">
            Ingresar
        </button>
    </form>

    <p class="muted">Solicite su cuenta al administrador.</p>
</div>
{% endblock %}
